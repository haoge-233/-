server:
  port: 9900
  # 默认只监听回环地址：这套接口没有任何内建身份验证，暴露到局域网等于开放免费调用额度。
  # 确实需要对外提供服务时，用 SERVER_ADDRESS=0.0.0.0 覆盖，并同时设置 SERVER_AUTH_TOKEN。
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  # /api/** 的访问令牌。留空表示不启用鉴权（仅限回环地址下的本地开发）。
  auth:
    token: ${SERVER_AUTH_TOKEN:}
  cors:
    allowed-origins: ${SERVER_CORS_ALLOWED_ORIGINS:http://localhost:9900,http://127.0.0.1:9900}

spring:
  servlet:
    multipart:
      # 显式设上限，避免用默认值被误当配置；上传的文件会整份进入向量索引流程
      max-file-size: 2MB
      max-request-size: 4MB
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          timeout: 180000
      retry:
        max-attempts: 3
        backoff:
          initial-interval: 2000
          multiplier: 2
          max-interval: 10000
    mcp:
      client:
        enabled: false
        name: tencent-mcp-server
        version: 1.0.0
        request-timeout: 60s
        sse:
          connections:
            tencent-cls:
              url: https://mcp-api.tencent-cloud.com
              sse-endpoint: /sse/http://localhost:3000/sse

# 会话存储上限。此前会话表无界增长，客户端每换一个 Id 就永久占一条记录从不释放；
# 现在按 LRU 淘汰最久未使用的会话。仅当服务被暴露到不可信网络时，这个值就是内存上界。
session:
  max-count: ${SESSION_MAX_COUNT:500}

file:
  upload:
    path: ./uploads
    allowed-extensions: txt,md

milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  username: ""
  password: ""
  database: default
  timeout: 10000

# 对话模型：基元律动 TokenRhythm 网关（OpenAI 兼容协议）
# base-url 不带 /v1 —— OpenAiApi 内部已把请求路径拼为 /v1/chat/completions
chat-api:
  base-url: ${TOKENRHYTHM_BASE_URL:https://tokenrhythm.studio}
  api-key: ${TOKENRHYTHM_API_KEY:}
  model: ${TOKENRHYTHM_MODEL:glm-5.3}
  # /api/ai_ops 专用模型。该接口已改为流式驱动，网关约 60s 的非流式空闲超时不再是硬约束，
  # 这里保留独立配置是为了单独控制运维编排的响应速度与成本。
  # 注意不要用 glm-5.3-flash：它会把整个 maxTokens 预算耗在 reasoning 上，正文返回为空。
  ops-model: ${TOKENRHYTHM_OPS_MODEL:deepseek-v4-flash}

# 阿里云 DashScope：现在只供文本向量化使用，对话模型已切到 chat-api
dashscope:
  api:
    key: ${DASHSCOPE_API_KEY:}
  embedding:
    model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v4}

document:
  chunk:
    max-size: 800
    overlap: 100

rag:
  top-k: 3

prometheus:
  base-url: ${PROMETHEUS_BASE_URL:http://localhost:9090}
  timeout: 10
  # 告警/日志数据源开关。为 true 时 AIOps 报告里的指标与日志全部来自内置模拟夹具，
  # 不是真实监控数据；接口会在响应中回显当前模式，避免被误当成生产结论。
  mock-enabled: ${PROMETHEUS_MOCK_ENABLED:true}

cls:
  mock-enabled: ${CLS_MOCK_ENABLED:true}
